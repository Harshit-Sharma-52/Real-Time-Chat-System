services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/chatapp
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
      - ALLOWED_ORIGINS=http://localhost:80
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - chat-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chat-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  chat-network:
    driver: bridge
